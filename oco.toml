# This repository's mark: a lens - the grand view of Rhizome.
schema = 1

[project]
id = "rhizome-oco/lens"
name = "Rhizome: stop managing software, start growing it"
title = "Rhizome lens"
kind = "lens"
parent = "open-commons-observatory"

[exports]
glimpses = "rhizome-oco/glimpses.json"
translations = "translations.json"
session_log = "session_log.json"

# What place this is, and what it gathers: every star of an owner (owner/*), or a star by name.
[place]
is = "constellation"
gathers = ["rhizome-oco/*", "git-rhizoid/git-rhizoid.github.io"]
